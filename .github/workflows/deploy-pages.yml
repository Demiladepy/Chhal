name: Deploy landing page to GitHub Pages

# Publishes the self-contained pitch page in web/ to GitHub Pages, so the submission has
# a public, permanent URL judges can open with no setup. The page is fully self-contained
# (inlined video, Google-Fonts only), so there is nothing to build — we just upload web/.
#
# ONE-TIME ENABLE (repo owner, ~20s): Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After that this runs on every push that touches web/.
# The site lands at https://demiladepy.github.io/Chhal/

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # turn Pages on via the API, so no manual Settings toggle is needed
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
